<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WanderGraph — Knowledge Graph Explorer Demo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #020617; color: #f1f5f9;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* ── Header ───────────────────────────── */
    header {
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; border-bottom: 1px solid #1e293b; background: rgba(2,6,23,.92);
      backdrop-filter: blur(12px); z-index: 10; flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 4px 12px rgba(99,102,241,.3);
    }
    .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -.4px; }
    .brand h1 span { color: #818cf8; }
    .brand .tag {
      font-size: 9px; text-transform: uppercase; font-weight: 700;
      background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.25);
      color: #818cf8; padding: 2px 6px; border-radius: 4px; letter-spacing: .6px;
    }

    .controls { display: flex; align-items: center; gap: 8px; }
    .layout-group {
      display: flex; background: #0f172a; border-radius: 8px; padding: 2px;
      border: 1px solid #1e293b;
    }
    .layout-group button {
      padding: 5px 10px; border: none; background: transparent; color: #94a3b8;
      font-size: 11px; font-weight: 600; border-radius: 6px; cursor: pointer;
      text-transform: capitalize; transition: all .15s;
    }
    .layout-group button.active { background: #6366f1; color: white; }
    .layout-group button:hover:not(.active) { color: white; }

    .zoom-group { display: flex; gap: 3px; margin-left: 6px; }
    .zoom-group button, .close-btn {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid #1e293b;
      background: #0f172a; color: #94a3b8; font-size: 14px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: all .15s;
    }
    .zoom-group button:hover, .close-btn:hover { color: white; background: #1e293b; }

    /* ── Search ───────────────────────────── */
    .search-box {
      position: relative; display: flex; align-items: center;
    }
    .search-box input {
      width: 180px; padding: 5px 8px 5px 28px; border-radius: 8px;
      background: #0f172a; border: 1px solid #1e293b; color: white;
      font-size: 11px; outline: none; transition: border-color .15s;
    }
    .search-box input:focus { border-color: #6366f1; }
    .search-box svg {
      position: absolute; left: 8px; width: 14px; height: 14px; color: #64748b;
      pointer-events: none;
    }

    /* ── City Tabs ────────────────────────── */
    .city-tabs {
      display: flex; gap: 6px; padding: 10px 20px; background: #0f172a;
      border-bottom: 1px solid #1e293b; flex-shrink: 0;
    }
    .city-tabs button {
      padding: 6px 14px; border-radius: 10px; border: 1px solid #334155;
      background: transparent; color: #94a3b8; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .15s;
    }
    .city-tabs button.active {
      background: linear-gradient(135deg, rgba(99,102,241,.18), rgba(168,85,247,.15));
      border-color: rgba(99,102,241,.5); color: #c7d2fe;
    }
    .city-tabs button:hover:not(.active) { border-color: #6366f1; color: #e2e8f0; }

    /* ── Main Canvas ─────────────────────── */
    .main { display: flex; flex: 1; overflow: hidden; position: relative; }
    #cy { flex: 1; cursor: grab; }
    #cy:active { cursor: grabbing; }

    /* ── Legend ───────────────────────────── */
    .legend {
      position: absolute; bottom: 16px; left: 16px; padding: 12px 14px;
      background: rgba(15,23,42,.92); border: 1px solid #1e293b;
      border-radius: 14px; backdrop-filter: blur(10px); z-index: 5;
      pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .legend h4 { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;
      letter-spacing: .6px; margin-bottom: 8px; }
    .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .legend-item span { font-size: 10px; color: #94a3b8; }

    /* ── Stats Bar ────────────────────────── */
    .stats-bar {
      position: absolute; top: 12px; left: 16px; display: flex; gap: 8px; z-index: 5;
    }
    .stat-pill {
      padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600;
      background: rgba(15,23,42,.88); border: 1px solid #1e293b;
      backdrop-filter: blur(8px); color: #94a3b8;
    }
    .stat-pill b { color: #818cf8; }

    /* ── Inspector Panel ─────────────────── */
    .inspector {
      width: 340px; background: rgba(15,23,42,.96); border-left: 1px solid #1e293b;
      padding: 20px; overflow-y: auto; flex-shrink: 0;
      transform: translateX(100%); transition: transform .2s ease;
      backdrop-filter: blur(12px);
    }
    .inspector.open { transform: translateX(0); }
    .inspector-header { display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 12px; border-bottom: 1px solid #1e293b; margin-bottom: 14px; }
    .type-badge {
      font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px;
      color: white; padding: 3px 8px; border-radius: 4px;
    }
    .inspector h3 { font-size: 16px; font-weight: 800; color: white; margin-top: 8px; }
    .inspector .node-id { font-size: 10px; color: #64748b; font-family: monospace; margin-top: 2px; }
    .props-box {
      margin-top: 14px; padding: 10px; background: #020617; border: 1px solid #1e293b;
      border-radius: 10px;
    }
    .props-box h4 { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;
      letter-spacing: .5px; margin-bottom: 8px; }
    .prop-row { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; }
    .prop-row .key { color: #64748b; font-family: monospace; font-size: 10px; }
    .prop-row .val { color: #cbd5e1; font-weight: 500; max-width: 160px; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .connections-box { margin-top: 14px; }
    .connections-box h4 { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;
      letter-spacing: .5px; margin-bottom: 8px; }
    .conn-item {
      display: flex; align-items: center; gap: 6px; font-size: 11px; color: #94a3b8;
      padding: 4px 0; cursor: pointer; transition: color .1s;
    }
    .conn-item:hover { color: #818cf8; }
    .conn-item .rel { font-size: 9px; color: #6366f1; background: rgba(99,102,241,.12);
      padding: 1px 5px; border-radius: 3px; font-weight: 600; }

    /* ── Responsive ───────────────────────── */
    @media (max-width: 768px) {
      .search-box, .layout-group, .zoom-group { display: none; }
      .inspector { width: 100%; position: absolute; right: 0; top: 0; bottom: 0; z-index: 20; }
      .legend { display: none; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand">

      </div>
      <div class="zoom-group">
        <button onclick="cy.zoom(cy.zoom()*1.3)" title="Zoom In">+</button>
        <button onclick="cy.zoom(cy.zoom()*0.7)" title="Zoom Out">−</button>

        <button onclick="cy.reset();cy.fit(undefined,30)" title="Reset">↺</button>
      </div>
    </div>
  </header>

  <!-- City Tabs -->

    <button data-city="tokyo">🇯🇵 Tokyo</button>
    <button data-city="kyoto">🇯🇵 Kyoto</button>
    <button data-city="all">🌍 Full Graph</button>
  </div>

  <!-- Main -->

    <div id="cy"></div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-pill">Nodes: <b id="nodeCount">0</b></div>
      <div class="stat-pill">Edges: <b id="edgeCount">0</b></div>
      <div class="stat-pill">Density: <b id="density">0</b></div>
    </div>

    <!-- Legend -->
    <div class="legend">

      <div class="legend-grid">
        <div class="legend-item"><div class="dot" style="background:#6366F1"></div><span>Place</span></div>
        <div class="legend-item"><div class="dot" style="background:#EC4899"></div><span>City</span></div>
        <div class="legend-item"><div class="dot" style="background:#10B981"></div><span>Category</span></div>
        <div class="legend-item"><div class="dot" style="background:#14B8A6"></div><span>Neighborhood</span></div>
        <div class="legend-item"><div class="dot" style="background:#F59E0B"></div><span>Companion</span></div>
        <div class="legend-item"><div class="dot" style="background:#06B6D4"></div><span>Atmosphere</span></div>
        <div class="legend-item"><div class="dot" style="background:#EAB308"></div><span>Time of Day</span></div>
        <div class="legend-item"><div class="dot" style="background:#F97316"></div><span>Price Range</span></div>
        <div class="legend-item"><div class="dot" style="background:#8B5CF6"></div><span>Interest</span></div>
        <div class="legend-item"><div class="dot" style="background:#EF4444"></div><span>Activity</span></div>
      </div>
    </div>

    <!-- Inspector -->
    <div class="inspector" id="inspector">
      <div class="inspector-header">
        <span class="type-badge" id="inspBadge">—</span>
        <button class="close-btn" onclick="closeInspector()">×</button>
      </div>
      <h3 id="inspLabel">—</h3>
      <p class="node-id" id="inspId">—</p>
      <div class="props-box" id="inspProps">
        <h4>Properties</h4>
        <div id="propsContent"></div>
      </div>
      <div class="connections-box">
        <h4>Connections</h4>
        <div id="connsContent"></div>
      </div>
    </div>
  </div>

// ─── Build Cytoscape Elements ────────────────────────────────
function buildElements(cityFilter) {
  const filteredNodes = graphNodes.filter(n =>
    !cityFilter || cityFilter === 'all' || n.city === cityFilter || n.city === null
  );
  const nodeIds = new Set(filteredNodes.map(n => n.id));
  const filteredEdges = graphEdges.filter(e => nodeIds.has(e.s) && nodeIds.has(e.t));

  const elements = [
    ...filteredNodes.map(n => ({
      data: {
        id: n.id, label: n.label, type: n.type,
        color: TYPE_COLORS[n.type] || '#6366F1',
        properties: n.props || {},
      },
    })),
    ...filteredEdges.map((e, i) => ({
      data: {
        id: `e${i}_${e.s}_${e.t}`, source: e.s, target: e.t,
        label: e.r.replace(/_/g, ' '), relation: e.r,
      },
    })),
  ];
  return elements;
}

// ─── Initialize Cytoscape ────────────────────────────────────
let cy;
let currentCity = 'hyderabad';

function initGraph(city) {
  currentCity = city;
  const elements = buildElements(city);

  if (cy) cy.destroy();

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    style: [
      {
        selector: 'node',
        style: {
          label: 'data(label)', 'background-color': 'data(color)',
          color: '#f8fafc', 'font-size': '10px', 'font-weight': 'bold',
          'text-valign': 'bottom', 'text-margin-y': 5,
          'text-background-color': '#0f172a', 'text-background-opacity': 0.85,
          'text-background-padding': '3px', 'text-background-shape': 'roundrectangle',
          width: 28, height: 28, 'border-width': 2, 'border-color': '#fff',
          'border-opacity': 0.25,
        },
      },
      {
        selector: 'node[type = "City"]',
        style: { width: 48, height: 48, 'font-size': '13px', 'border-width': 3, 'border-color': '#ec4899' },
      },
      {
        selector: 'node[type = "Place"]',
        style: { width: 34, height: 34, 'border-color': '#818cf8' },
      },
      {
        selector: 'edge',
        style: {
          width: 1.2, 'line-color': '#334155', 'target-arrow-color': '#64748b',
          'target-arrow-shape': 'triangle', 'curve-style': 'bezier',
          label: 'data(label)', 'font-size': '7px', color: '#64748b',
          'text-rotation': 'autorotate', 'text-background-color': '#020617',
          'text-background-opacity': 0.8, 'text-background-padding': '1px',
        },
      },
      {
        selector: 'edge[relation = "NEARBY_TO"]',
        style: { 'line-style': 'dashed', 'line-color': '#6366f1', 'target-arrow-shape': 'none' },
      },
      {
        selector: ':selected',
        style: { 'border-width': 4, 'border-color': '#38bdf8', 'line-color': '#38bdf8', 'target-arrow-color': '#38bdf8' },
      },
    ],
    layout: { name: 'cose', animate: true, animationDuration: 600, nodeRepulsion: () => 8000, idealEdgeLength: () => 80 },
  });

  // Update stats
  document.getElementById('nodeCount').textContent = cy.nodes().length;
  document.getElementById('edgeCount').textContent = cy.edges().length;
  const n = cy.nodes().length;
  const e = cy.edges().length;
  const d = n > 1 ? (e / (n * (n - 1))).toFixed(4) : '0';
  document.getElementById('density').textContent = d;

  // Node click
  cy.on('tap', 'node', evt => openInspector(evt.target));
  cy.on('tap', evt => { if (evt.target === cy) closeInspector(); });

  window.cy = cy;
}

// ─── Inspector ───────────────────────────────────────────────
function openInspector(node) {
  const d = node.data();
  const panel = document.getElementById('inspector');
  panel.classList.add('open');

  document.getElementById('inspBadge').textContent = d.type;
  document.getElementById('inspBadge').style.background = d.color;
  document.getElementById('inspLabel').textContent = d.label;
  document.getElementById('inspId').textContent = `ID: ${d.id}`;

  const propsEl = document.getElementById('propsContent');
  propsEl.innerHTML = '';
  if (d.properties) {
    Object.entries(d.properties).forEach(([k, v]) => {
      const row = document.createElement('div');
      row.className = 'prop-row';
      row.innerHTML = `<span class="key">${k}</span><span class="val">${v}</span>`;
      propsEl.appendChild(row);
    });
  }

  const connsEl = document.getElementById('connsContent');
  connsEl.innerHTML = '';
  const edges = node.connectedEdges();
  edges.forEach(edge => {
    const other = edge.source().id() === node.id() ? edge.target() : edge.source();
    const item = document.createElement('div');
    item.className = 'conn-item';
    item.innerHTML = `<span class="rel">${edge.data('relation')}</span> ${other.data('label')}`;
    item.onclick = () => {
      cy.center(other); cy.zoom({ level: 1.5, position: other.position() });
      other.select(); openInspector(other);
    };
    connsEl.appendChild(item);
  });
}

function closeInspector() {
  document.getElementById('inspector').classList.remove('open');
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && cy) {
    const q = e.target.value.toLowerCase().trim();
    if (!q) return;
    const matched = cy.nodes().filter(n => (n.data('label') || '').toLowerCase().includes(q));
    if (matched.length > 0) {
      cy.nodes().unselect();
      matched.select();
      cy.center(matched);
      const first = matched.first();
      cy.zoom({ level: 1.4, position: first.position() });
      openInspector(first);
    }
  }
});

// Init
initGraph('hyderabad');
</script>
