<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#0f172a" opacity=".9"/>
  <rect x="0" y="51" width="1200" height="1" fill="#1e293b"/>
  <circle cx="30" cy="26" r="12" fill="#6366f1" opacity=".8"/>
  <text x="50" y="31" fill="white" font-family="Inter,sans-serif" font-size="16" font-weight="800">Wander<tspan fill="#818cf8">Graph</tspan></text>
  <rect x="170" y="14" width="44" height="18" rx="3" fill="rgba(99,102,241,.12)" stroke="rgba(99,102,241,.3)" stroke-width=".5"/>
  <text x="180" y="27" fill="#818cf8" font-family="Inter,sans-serif" font-size="8" font-weight="700">KG AI</text>
  <text x="1060" y="30" fill="#64748b" font-family="Inter,sans-serif" font-size="11" font-weight="600">NetworkX • MultiDiGraph</text>

