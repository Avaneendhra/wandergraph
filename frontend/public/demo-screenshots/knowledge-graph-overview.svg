  <text x="840" y="79" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" font-weight="600">Nodes: <tspan fill="#818cf8" font-weight="800">82</tspan>  •  Edges: <tspan fill="#818cf8" font-weight="800">247</tspan>  •  Entity Types: <tspan fill="#818cf8" font-weight="800">12</tspan>  •  Relations: <tspan fill="#818cf8" font-weight="800">12</tspan></text>
